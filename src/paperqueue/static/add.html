<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)" data-scheme="light">
  <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)" data-scheme="dark">
  <title>Save to paperqueue</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/add.js" defer></script>
</head>
<body>
  <div class="shell confirm-page">
    <header class="top">
      <div class="brand">
        <h1 class="wordmark"><a href="/">PAPERQUEUE</a></h1>
        <span class="version">SAVE TO YOUR READING QUEUE</span>
      </div>
    </header>

    <section class="panel" aria-labelledby="hint-title">
      <div class="panel-bar"><span id="hint-kicker">FROM THIS PAGE</span></div>
      <div class="panel-body">
        <h2 class="confirm-title"><span class="ink" aria-hidden="true">&gt;</span> <span id="hint-title">…</span></h2>
        <dl class="dl" id="hint-meta"></dl>
        <p class="confirm-abstract" id="hint-abstract" hidden></p>
      </div>
    </section>

    <form class="panel confirm-form" id="save-form" autocomplete="off">
      <div class="panel-bar"><span>SAVE</span><span><kbd>⌘ ENTER</kbd> SAVES</span></div>
      <div class="panel-body">
        <div class="field-row">
          <label class="field">PRIORITY
            <select class="select" id="save-priority">
              <option value="1">HIGH</option>
              <option value="2" selected>NORMAL</option>
              <option value="3">LOW</option>
            </select>
          </label>
          <label class="field">SCHEDULE
            <select class="select" id="save-when">
              <option value="next" selected>NEXT FREE SLOT</option>
              <option value="none">DON'T SCHEDULE</option>
              <option value="pick">PICK A TIME…</option>
            </select>
          </label>
        </div>
        <label class="field" id="save-at-field" hidden>DATE &amp; TIME
          <input class="input" type="datetime-local" id="save-at" step="300">
        </label>
        <label class="field">TAGS, SEPARATED BY COMMAS
          <input class="input" type="text" id="save-tags" placeholder="e.g. single-cell, methods" spellcheck="false">
        </label>
        <div class="confirm-actions">
          <button class="cta" id="save-button" type="submit">[ENTER] SAVE</button>
          <button class="key" id="cancel-button" type="button"><b>[ESC]</b> CANCEL</button>
        </div>
      </div>
    </form>

    <section class="panel" id="result" hidden aria-live="polite">
      <div class="panel-bar"><span>RESULT</span></div>
      <div class="panel-body">
        <h2 class="confirm-title" id="result-title" tabindex="-1"></h2>
        <p id="result-when"></p>
        <p class="hint" id="result-warnings"></p>
        <div class="confirm-actions">
          <button class="cta" id="close-button" type="button">CLOSE TAB</button>
          <a class="key" href="/">OPEN THE QUEUE</a>
        </div>
      </div>
    </section>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
